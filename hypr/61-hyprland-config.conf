# Quem o Hyprland carrega. Esta linha e a inversao de posse inteira.
#
# O `~/.config/uwsm/env-hyprland.d/00-hyde.sh` do HyDE define a dele assim:
#
#     HYPRLAND_CONFIG="${HYPRLAND_CONFIG:-.../hypr/hyde.lua}"
#
# O `:-` significa "so se ninguem definiu antes". O environment.d e lido pelo
# systemd do usuario ANTES de o uwsm subir o Hyprland, entao definir aqui ganha
# sem tocar em nenhum arquivo do HyDE.
#
# Para voltar ao HyDE: apague este arquivo e refaca o login. Nao precisa mexer
# em mais nada - o hyprland.lua tem os dois papeis e se comporta como a camada
# de override de antes quando quem carrega e o hyde.lua.
HYPRLAND_CONFIG=/home/SEU-USUARIO/.config/hypr/hyprland.lua
